name: cmake

on:
  push:
    branches:
      - 'main'
      - 'dev**'

env:
  BUILD_TYPE: RELEASE
  GITHUB_TOKEN: ${{secrets.CI_TOKEN}}

jobs:
  cmake:
    name: cmake
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, ubuntu-26.04-arm, ubuntu-24.04-arm, windows-2022, windows-2025]

    steps:
      - name: Checkout Model
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          token: ${{secrets.CI_TOKEN}}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          pip install pexpect

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          cmake -B BUILD -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
                                  -DSYSTEMC_UNITY_BUILD=ON \
                                  -DVCML_UNITY_BUILD=ON \
                                  -DVCML_SILKIT_TESTS=ON .

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B BUILD -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DVCML_SILKIT_TESTS=ON .

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build BUILD

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build BUILD --config ${{env.BUILD_TYPE}} -- /bl

      - name: Test
        working-directory: BUILD
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

      - name: Upload Logs
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: ${{github.event.repository.name}}-logs-${{matrix.os}}
          path: |
              BUILD/.ninja_log
              BUILD/CMakeCache.txt
              BUILD/msbuild.binlog
              BUILD/Testing/Temporary/LastTest.log
          include-hidden-files: true
          retention-days: 7
